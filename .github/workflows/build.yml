name: Build apps
on: [push, workflow_dispatch]
jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Prepare www
        shell: bash
        run: mkdir www && cp index.html manifest.webmanifest sw.js icon.svg icon.ico icon-*.png www/
      - run: pip install pyinstaller pywebview
      - run: pyinstaller --noconsole --onefile --name TrekerPitaniya --add-data "www;www" --icon www/icon.ico desktop_app.py
      - uses: actions/upload-artifact@v4
        with: {name: TrekerPitaniya-exe, path: dist/TrekerPitaniya.exe}
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - name: Prepare www
        run: mkdir www && cp index.html manifest.webmanifest sw.js icon.svg icon-*.png www/
      - name: Capacitor Android
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Трекер питания" com.tracker.pitaniya --web-dir www
          npx cap add android
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: {name: TrekerPitaniya-apk, path: android/app/build/outputs/apk/debug/app-debug.apk}
