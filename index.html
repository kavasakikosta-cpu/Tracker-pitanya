<head>

<title>Трекер питания</title>

<style>
:root{--bg:#07040f;--bg2:#1a0a33;--card:rgba(30,17,54,.8);--text:#f2eaff;--muted:#aa9bc9;--line:rgba(168,120,255,.24);
  --accent:#b07cff;--accent-d:#8b4df0;--accent-l:rgba(176,124,255,.16);--warn-l:rgba(255,196,87,.12);--bad:#ff6b8a;
  --shadow:0 8px 30px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#07040f}
body{margin:0;color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;
  background:radial-gradient(900px 520px at 90% -5%,rgba(139,77,240,.42),transparent 60%),
  radial-gradient(700px 520px at -10% 45%,rgba(88,28,170,.32),transparent 60%),
  radial-gradient(600px 400px at 100% 100%,rgba(120,40,200,.25),transparent 60%),
  linear-gradient(180deg,#14082a 0,#07040f 60%) fixed;
  padding-bottom:calc(86px + env(safe-area-inset-bottom))}
header{background:linear-gradient(135deg,#7c3aed 0,#4c1d95 55%,#1a0836 100%);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 22px;
  border-radius:0 0 28px 28px;box-shadow:0 10px 40px rgba(124,58,237,.35);border-bottom:1px solid rgba(255,255,255,.1)}
header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:.2px}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:640px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{font-size:22px;margin:4px 0 12px;font-weight:700} h3{font-size:16px;margin:0 0 8px}
.muted{color:var(--muted);font-size:14px}
.goal{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;color:var(--text);font:inherit;box-shadow:var(--shadow);transition:transform .15s,border-color .15s}
.goal:active{transform:scale(.98);border-color:var(--accent)} .goal b{display:block;font-size:17px;margin-bottom:4px}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px;color:var(--muted)}
input,select{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(8,4,18,.65);color:var(--text)}
input::placeholder{color:#7d6da0}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-l)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg button{padding:13px;border-radius:14px;border:1.5px solid var(--line);background:rgba(8,4,18,.65);color:var(--text);font:inherit}
.seg button.on{border-color:var(--accent);background:var(--accent-l);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:rgba(8,4,18,.65);color:var(--text);font:inherit;font-size:14px}
.chip.on{border-color:var(--accent);background:var(--accent-l);font-weight:600;box-shadow:0 0 14px rgba(176,124,255,.25)}
.btn{display:block;width:100%;border:0;border-radius:16px;background:linear-gradient(135deg,#a66bff,#6d28d9);color:#fff;font:inherit;font-weight:600;padding:15px;margin-top:16px;box-shadow:0 6px 22px rgba(124,58,237,.45)}
.btn:active{transform:scale(.98)} .btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent);box-shadow:none}
.btn.danger{background:#c2305a;box-shadow:none} .btn:disabled{opacity:.7}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.big{font-size:42px;font-weight:700;background:linear-gradient(135deg,#d9c2ff,#a66bff);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)} .kv:last-child{border:0}
.note{background:var(--warn-l);border:1px solid rgba(255,196,87,.18);border-radius:14px;padding:11px 13px;font-size:14px;margin:10px 0}
.bar{height:14px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#d0b0ff,#8b4df0);border-radius:10px;transition:width .4s;box-shadow:0 0 12px rgba(176,124,255,.6)}
.bar i.over{background:var(--bad)}
.meal{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px;color:var(--text);font:inherit;box-shadow:var(--shadow)}
.meal:active{transform:scale(.98)}
.meal .mi{width:48px;height:48px;border-radius:14px;background:var(--accent-l);display:grid;place-items:center;font-size:26px}
.meal b{flex:1}.meal span.k{color:var(--accent);font-weight:700}
.dish{border:1px solid var(--line);border-radius:20px;margin-bottom:16px;background:var(--card);overflow:hidden;box-shadow:var(--shadow)}
.dish summary{cursor:pointer;list-style:none} .dish summary::-webkit-details-marker{display:none}
.dish .cap{padding:12px 16px 14px}.dish .cap b{display:block;font-size:17px}.dish .cap small{color:var(--muted)}
.dish .body{padding:0 16px 16px}
.dish ul,.dish ol{padding-left:20px;margin:6px 0}.dish li{margin:3px 0}
.dish .add{margin-top:12px;padding:12px}
.pic{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h) 45% 30%),hsl(calc(var(--h) + 40) 55% 15%))}
.pic .emo{font-size:60px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5));letter-spacing:6px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));max-width:616px;margin:0 auto;background:rgba(20,10,40,.92);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:24px;display:flex;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.6)}
nav button{flex:1;background:none;border:0;border-radius:18px;padding:8px 2px 7px;color:var(--muted);font:inherit;font-size:11.5px}
nav button .ic{display:block;font-size:21px} nav button.on{color:#fff;background:var(--accent-l);font-weight:700}
.entry{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.entry button{background:none;border:0;color:var(--bad);font-size:18px;padding:4px 8px}
.hide{display:none}
</style>
</head>
<body>
<header><h1>🥗 Трекер питания</h1><p>Питание под вашу цель — спокойно и с заботой о себе</p></header>
<main id="app"></main>

  <button data-tab="plan"><span class="ic">🍽️</span>План</button>

</nav>

  if (custom){
    const dBmi = p.desired/(p.height/100)**2;
    const place = p.desired < lo ? "ниже нормы" : p.desired > hi ? "выше нормы" : "в пределах нормы";
    desiredInfo = `Желаемый вес ${p.desired} кг — ИМТ ${dBmi.toFixed(1)}, это ${place}.`;
    if (p.desired < lo*0.9) notes.push("Желаемый вес заметно ниже нормы — такую цель лучше обсудить с врачом.");
  }
  const bmr = bmrMifflin(p.weight,p.height,p.age,male), tdee = bmr*p.activity;
  let floor, maxDef, defShare, gainSur;
  if (g === "teen"){ floor = male?1600:1400; maxDef=300; defShare=0.10; gainSur=300;
    notes.push("Подросток растёт, поэтому план мягкий: следите за динамикой ИМТ, а не только за весом."); }
  else if (g === "senior"){ floor = male?1400:1200; maxDef=300; defShare=0.10; gainSur=300;
    notes.push("Для возраста 65+ план мягкий: важно сохранять мышцы — достаточно белка и посильная физическая активность."); }
  else { floor = male?1500:1200; maxDef=500; defShare=0.20; gainSur=300; }

  const gLo = custom ? p.desired : lo, gHi = custom ? p.desired : hi;
  let goal, diff = 0, status, daily;
  if (p.weight > gHi + 0.05){
    goal = "loss"; diff = p.weight - gHi;
    status = custom ? `Цель — снизить вес на ${diff.toFixed(1)} кг (до ${gHi} кг).` : `Вес выше нормы на ${diff.toFixed(1)} кг — цель: снижение до ${gHi} кг.`;
    daily = Math.max(tdee - Math.min(maxDef, defShare*tdee), floor);
  } else if (p.weight < gLo - 0.05){
    goal = "gain"; diff = gLo - p.weight;
    status = custom ? `Цель — набрать ${diff.toFixed(1)} кг (до ${gLo} кг).` : `Вес ниже нормы на ${diff.toFixed(1)} кг — цель: набор до ${gLo} кг.`;
    daily = tdee + gainSur;
  } else {
    goal = "keep";
    status = custom ? "Ваш вес уже равен желаемому — цель: поддержание веса." : "Ваш вес в пределах нормы — цель: поддержание веса.";
    daily = tdee;
  }
  daily = Math.round(daily/10)*10;
  if (p.weight < lo*0.85) notes.push("Вес заметно ниже нормы — при таком отклонении хорошо бы сверить план с врачом.");
  else if (p.weight > hi*1.35) notes.push("Вес заметно выше нормы — при таком отклонении хорошо бы сверить план с врачом.");
  let weekly = null, weeks = null;
  const real = Math.abs(daily - tdee);
  if (goal !== "keep" && real > 0){ weekly = real*7/7700; weeks = diff/weekly; }
  const meals = MEALS.map(([name,type,share,icon]) => ({name,type,icon,share,kcal:Math.round(daily*share/5)*5}));
  return {bmi,lo,hi,source,desiredInfo,bmr,tdee,daily,status,notes,weekly,weeks,goal,meals};
}

/* ---------- Состояние ---------- */
const LS = "tracker_pitaniya_v1";
let S = load();
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
function load(){ try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch(e){ return {}; } }
function save(){ try { localStorage.setItem(LS, JSON.stringify(S)); } catch(e){} }
const today = () => new Date().toISOString().slice(0,10);
function diaryToday(){
  if (!S.diary || S.diary.date !== today()) S.diary = {date: today(), items: []};
  return S.diary;
}
const eatenKcal = () => diaryToday().items.reduce((s,i)=>s+i.kcal,0);

let tab = "plan", mealView = null, mealPage = 0, allergyEdit = false, draft = {mode:null, sex:"m"};
const $ = s => document.querySelector(s), app = $("#app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- Экраны ---------- */
function render(){
  const ready = !!S.plan;
  $("#nav").classList.toggle("hide", !ready);
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  if (!ready){ return draft.mode ? (draft.profile ? screenAllergy() : screenForm()) : screenGoal(); }
  if (allergyEdit || !S.allergies) return screenAllergy();
  if (tab === "plan") return mealView !== null ? screenMeal() : screenPlan();
  if (tab === "diary") return screenDiary();
  if (tab === "summary") return screenSummary();
  return screenSettings();
}

function screenGoal(){
  app.innerHTML = `
    <h2>Для чего вам приложение?</h2>
    <p class="muted">Выберите цель — от неё зависит, какие данные нужны и как считается план.</p>
    <button class="goal" data-mode="norm"><b>📏 Прийти к общепринятой норме веса</b>
      <span class="muted">Норма определяется по вашему росту, возрасту и полу (взрослые, подростки 10–17, 65+).</span></button>
    <button class="goal" data-mode="custom"><b>🎯 Прийти к своему желаемому весу</b>
      <span class="muted">Вы сами задаёте вес, к которому хотите прийти, — приложение подберёт калорийность и темп.</span></button>
    <p class="muted" style="text-align:center">Приложение справочное и не заменяет консультацию врача или диетолога.</p>`;
  app.querySelectorAll(".goal").forEach(b => b.onclick = () => { draft.mode = b.dataset.mode; render(); });
}

function screenForm(){
  const custom = draft.mode === "custom", d = draft;
  app.innerHTML = `
    <h2>${custom ? "Ваш желаемый вес" : "Сравнение с нормой"}</h2>
    <div class="card">
      <div class="row">
        <div><label>Вес, кг</label><input id="f_w" type="text" inputmode="decimal" value="${d.weight??""}" placeholder="70"></div>
        <div><label>Рост, см</label><input id="f_h" type="text" inputmode="decimal" value="${d.height??""}" placeholder="170"></div>
      </div>
      <div class="row">
        <div><label>Возраст, лет</label><input id="f_a" type="text" inputmode="decimal" value="${d.age??""}" placeholder="30"></div>
        ${custom ? `<div><label>Желаемый вес, кг</label><input id="f_d" type="text" inputmode="decimal" value="${d.desired??""}" placeholder="65"></div>` : "<div></div>"}
      </div>
      <label>Пол</label>
      <div class="seg" id="sex"><button data-v="m" class="${d.sex==="m"?"on":""}">Мужской</button><button data-v="f" class="${d.sex==="f"?"on":""}">Женский</button></div>
      <label>Физическая активность</label>
      <select id="f_act">${ACTIVITY.map((a,i)=>`<option value="${i}" ${(d.act??0)==i?"selected":""}>${a[0]}</option>`).join("")}</select>
      <div class="err" id="err"></div>
      <button class="btn" id="go">Далее</button>
      <button class="btn ghost" id="back">Назад</button>
    </div>`;
  $("#sex").querySelectorAll("button").forEach(b => b.onclick = () => { d.sex = b.dataset.v; keep(); render(); });
  const keep = () => { d.weight=$("#f_w").value; d.height=$("#f_h").value; d.age=$("#f_a").value; if(custom) d.desired=$("#f_d").value; d.act=$("#f_act").value; };
  $("#back").onclick = () => { keep(); draft.mode = null; render(); };
  $("#go").onclick = () => {
    keep();
    const num = (v) => parseFloat(String(v).replace(",", "."));
    const w=num(d.weight), h=num(d.height), a=num(d.age), ds = custom ? num(d.desired) : null;
    const chk = (v,lo,hi,name) => (isNaN(v)||v<lo||v>hi) ? `${name}: введите число от ${lo} до ${hi}.` : null;
    const err = chk(w,30,250,"Вес") || chk(h,120,230,"Рост") || chk(a,10,110,"Возраст") || (custom && chk(ds,30,250,"Желаемый вес"));
    if (err){ $("#err").textContent = err; return; }
    draft.profile = {mode:d.mode,weight:w,height:h,age:a,desired:ds,sex:d.sex,activity:ACTIVITY[+d.act][1]};
    render(); scrollTo(0,0);
  };
}

function screenAllergy(){
  const editing = !!S.plan;
  if (!draft.alg) draft.alg = JSON.parse(JSON.stringify(S.allergies || {has:null, codes:[], custom:""}));
  const A = draft.alg;
  app.innerHTML = `
    <h2>Есть ли у вас пищевая аллергия?</h2>
    <p class="muted">Блюда с этими продуктами мы уберём из рекомендаций.</p>
    <div class="card">
      <div class="seg" id="has"><button data-v="0" class="${A.has===false?"on":""}">Нет аллергии</button><button data-v="1" class="${A.has===true?"on":""}">Да, есть</button></div>
      ${A.has ? `<label>На что аллергия? (можно выбрать несколько)</label>
        <div class="chips">${Object.entries(DATA.AL).map(([c,t])=>`<button class="chip ${A.codes.includes(c)?"on":""}" data-c="${c}">${esc(t)}</button>`).join("")}</div>
        <label>Другое (через запятую)</label>
        <input id="a_c" value="${esc(A.custom)}" placeholder="например: клубника, горох">` : ""}
      <div class="err" id="err"></div>
      <button class="btn" id="ok">${editing ? "Сохранить" : "Рассчитать план"}</button>
      ${editing ? (S.allergies ? `<button class="btn ghost" id="cancel">Отмена</button>` : "") : `<button class="btn ghost" id="back">Назад</button>`}
    </div>
    <p class="muted" style="text-align:center">При аллергии всегда проверяйте составы продуктов: возможны следовые количества аллергенов.</p>`;
  const keep = () => { const i = $("#a_c"); if (i) A.custom = i.value; };
  $("#has").querySelectorAll("button").forEach(b => b.onclick = () => { keep(); A.has = b.dataset.v === "1"; render(); });
  app.querySelectorAll(".chip").forEach(b => b.onclick = () => { keep(); const c = b.dataset.c; A.codes = A.codes.includes(c) ? A.codes.filter(x => x !== c) : [...A.codes, c]; render(); });
  const back = $("#back"); if (back) back.onclick = () => { keep(); draft.profile = null; render(); };
  const cn = $("#cancel"); if (cn) cn.onclick = () => { draft.alg = null; allergyEdit = false; render(); };
  $("#ok").onclick = () => {
    keep();
    if (A.has === null){ $("#err").textContent = "Выберите вариант."; return; }
    if (A.has && !A.codes.length && !A.custom.trim()){ $("#err").textContent = "Отметьте аллерген или впишите свой — либо выберите «Нет аллергии»."; return; }
    const al = A.has ? {has:true, codes:A.codes, custom:A.custom.trim()} : {has:false, codes:[], custom:""};
    if (editing){ S.allergies = al; }
    else { const p = draft.profile; S = {profile:p, diary:{date:today(),items:[]}, allergies:al}; S.plan = buildPlan(p); tab = "plan"; }
    draft.alg = null; draft.profile = null; allergyEdit = false; mealView = null; mealPage = 0; save(); render(); scrollTo(0,0);
  };
}
const algText = () => { const A = alg(); if (!A.has) return "нет"; return [...A.codes.map(c => DATA.AL[c].split(" (")[0]), ...(A.custom ? [A.custom] : [])].join(", "); };

function screenPlan(){
  const p = S.plan, pr = S.profile, eaten = eatenKcal(), pct = Math.min(100, eaten/p.daily*100);
  app.innerHTML = `
    <div class="card">
      <div class="muted">Рекомендуемая калорийность</div>
      <div class="big">${p.daily} <span style="font-size:18px">ккал/день</span></div>
      <p style="margin:8px 0 0"><b>${esc(p.status)}</b></p>
      ${p.weekly ? `<p class="muted" style="margin:4px 0 0">Темп ≈ ${p.weekly.toFixed(2)} кг/нед, до цели примерно ${Math.round(p.weeks)} нед.</p>` : ""}
      ${p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}
    </div>
    <div class="card">
      <h3>Сегодня</h3>
      <div class="bar"><i class="${eaten>p.daily?"over":""}" style="width:${pct}%"></i></div>
      <div class="muted">Съедено ${Math.round(eaten)} из ${p.daily} ккал</div>
    </div>
    <h3 style="margin:16px 4px 10px">Приёмы пищи — нажмите, чтобы увидеть блюда</h3>
    ${p.meals.map((m,i)=>`<button class="meal" data-i="${i}"><span class="mi">${m.icon}</span><b>${m.name}</b><span class="k">${m.kcal} ккал</span></button>`).join("")}`;
  app.querySelectorAll(".meal").forEach(b => b.onclick = () => { mealView = +b.dataset.i; mealPage = 0; render(); scrollTo(0,0); });
}

function fmtIng(n,g){
  if (n === "вода") return `${n} — ${g} мл`;
  let s = `${n} — ${g} г`;
  if (DATA.PIECE[n]) s += ` (≈ ${(g/DATA.PIECE[n]).toFixed(1).replace(".0","")} шт)`;
  return s;
}
function dishPic(d){
  const i = DATA.DISHES.indexOf(d);
  return `<div class="pic" style="--h:${(i*47)%360}"><span class="emo">${d.emoji||"🍽️"}</span></div>`;
}
function screenMeal(){
  const m = S.plan.meals[mealView], list = suggest(m.type, m.kcal, 3, mealPage);
  app.innerHTML = `
    <button class="btn ghost" id="back" style="margin:0 0 14px">← К плану</button>
    <h2>${m.icon} ${m.name} — ${m.kcal} ккал</h2>
    ${alg().has ? `<div class="note">🛡️ Учтена аллергия (${esc(algText())}): блюда с этими продуктами исключены.</div>` : ""}
    ${list.length ? list.map((d,i)=>{
      const s = scaleDish(d, m.kcal);
      return `<details class="dish" ${i===0?"open":""}>
        <summary>${dishPic(d)}<div class="cap"><b>${esc(d.name)}</b><small>~${s.weight} г готового блюда · ≈ ${s.kcal} ккал · нажмите, чтобы открыть рецепт</small></div></summary>
        <div class="body">
          ${(s.f<0.6||s.f>1.7)?`<div class="note">Порция заметно отличается от стандартной — при необходимости разделите на два приёма или добавьте гарнир.</div>`:""}
          <h3 style="margin-top:10px">Ингредиенты</h3>
          <ul>${s.ings.map(([n,g])=>`<li>${esc(fmtIng(n,g))}</li>`).join("")}</ul>
          <h3>Приготовление</h3>
          <ol>${d.steps.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
          <button class="btn add" data-k="${s.kcal}" data-n="${esc(d.name)}">+ Съел(а) это (${s.kcal} ккал)</button>
        </div></details>`;
    }).join("") : `<div class="card">С вашими ограничениями подходящих блюд для этого приёма пищи нет. Можно изменить список аллергий в «Настройках».</div>`}
    ${list.length > 1 ? `<button class="btn ghost" id="more">🔄 Показать другие блюда</button>` : ""}`;
  $("#back").onclick = () => { mealView = null; render(); };
  const more = $("#more"); if (more) more.onclick = () => { mealPage++; render(); scrollTo(0,0); };
  app.querySelectorAll(".add").forEach(b => b.onclick = () => {
    diaryToday().items.push({name:b.dataset.n, kcal:+b.dataset.k}); save();
    b.textContent = "✓ Записано в дневник"; b.disabled = true;
  });
}

function screenDiary(){
  const dd = diaryToday(), eaten = eatenKcal(), left = S.plan.daily - eaten;
  app.innerHTML = `
    <h2>Дневник за сегодня</h2>
    <div class="card">
      <div class="kv"><span>Норма на день</span><b>${S.plan.daily} ккал</b></div>
      <div class="kv"><span>Съедено</span><b>${Math.round(eaten)} ккал</b></div>
      <div class="kv"><span>${left>=0?"Осталось":"Превышение"}</span><b style="color:${left>=0?"var(--accent)":"var(--bad)"}">${Math.abs(Math.round(left))} ккал</b></div>
    </div>
    <div class="card">
      <h3>Добавить вручную</h3>
      <div class="row"><div><input id="d_n" placeholder="Что съели (необязательно)"></div><div><input id="d_k" type="text" inputmode="decimal" placeholder="ккал"></div></div>
      <div class="err" id="err"></div>
      <button class="btn" id="add" style="margin-top:10px">Добавить</button>
    </div>
    <div class="card"><h3>Записи</h3>
      ${dd.items.length ? dd.items.map((it,i)=>`<div class="entry"><span>${esc(it.name)}</span><span><b>${Math.round(it.kcal)}</b> ккал <button data-i="${i}" aria-label="Удалить">✕</button></span></div>`).join("") : `<p class="muted">Пока пусто.</p>`}
    </div>`;
  $("#add").onclick = () => {
    const k = parseFloat($("#d_k").value.replace(",", "."));
    if (isNaN(k) || k < 0 || k > 5000){ $("#err").textContent = "Введите калорийность от 0 до 5000."; return; }
    dd.items.push({name:$("#d_n").value.trim() || "Без названия", kcal:k}); save(); render();
  };
  app.querySelectorAll(".entry button").forEach(b => b.onclick = () => { dd.items.splice(+b.dataset.i,1); save(); render(); });
}

function screenSummary(){
  const p = S.plan, pr = S.profile;
  app.innerHTML = `
    <h2>Ваши показатели</h2>
    <div class="card">
      <div class="kv"><span>Цель</span><b>${pr.mode==="custom" ? "свой вес ("+pr.desired+" кг)" : "общепринятая норма"}</b></div>
      <div class="kv"><span>Ваш ИМТ</span><b>${p.bmi.toFixed(1)}</b></div>
      <div class="kv"><span>Норма веса для ${pr.height} см</span><b>${p.lo}–${p.hi} кг</b></div>
      <div class="kv"><span>Базовый обмен</span><b>${Math.round(p.bmr)} ккал</b></div>
      <div class="kv"><span>С учётом активности</span><b>${Math.round(p.tdee)} ккал</b></div>
      <div class="kv"><span>План на день</span><b>${p.daily} ккал</b></div>
      <div class="kv"><span>Аллергия</span><b style="text-align:right">${esc(algText())}</b></div>
      <p class="muted">Норма: ${esc(p.source)}.</p>
      ${p.desiredInfo ? `<div class="note">${esc(p.desiredInfo)}</div>` : ""}
      ${p.notes.map(n=>`<div class="note">${esc(n)}</div>`).join("")}
    </div>
    <p class="muted" style="text-align:center">Приложение справочное и не заменяет консультацию врача или диетолога.</p>`;
}

function screenSettings(){
  app.innerHTML = `
    <h2>Настройки</h2>
    <div class="card">
      <h3>Аллергии</h3>
      <p class="muted">Сейчас: ${esc(algText())}</p>
      <button class="btn ghost" id="alg" style="margin-top:8px">Изменить аллергии</button>
    </div>
    <div class="card">
      <h3>Сбросить прогресс</h3>
      <p class="muted">Будут удалены ваши данные, план и дневник. После этого можно выбрать цель и ввести данные заново.</p>
      <button class="btn danger" id="reset">Сбросить прогресс</button>
    </div>
    <p class="muted" style="text-align:center">Приложение справочное и не заменяет консультацию врача или диетолога.</p>`;
  $("#alg").onclick = () => { draft.alg = null; allergyEdit = true; render(); scrollTo(0,0); };
  $("#reset").onclick = () => {
    if (!confirm("Сбросить весь прогресс? Это действие нельзя отменить.")) return;
    S = {}; save(); draft = {mode:null, sex:"m"}; tab = "plan"; mealView = null; render(); scrollTo(0,0);
  };
}

document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; mealView = null; allergyEdit = false; draft.alg = null; render(); scrollTo(0,0); });
render();
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(()=>{});
